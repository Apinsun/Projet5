name: Deploy to Hugging Face Space

on:
    push:
        branches: [ "main" ]
    workflow_dispatch:

jobs:
    sync-to-hub:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
              with:
                    fetch-depth: 0
            - name: Push to hub
              env:
                    HF_TOKEN: ${{ secrets.HUGGINFACETOKEN }}
              run: git push --force https://apinsun:$HF_TOKEN@huggingface.co/spaces/apinsun/Projet5 main
