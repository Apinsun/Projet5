site_name: Documentation - Projet Turnover ML
theme:
  name: material
  palette:
    primary: indigo

nav:
  - Accueil & Architecture: index.md
  - Documentation de l'API: api.md
  - Modèle & Performances: modele.md
  - Maintenance & CI/CD: maintenance.md
  - BDD: bdd.md
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
